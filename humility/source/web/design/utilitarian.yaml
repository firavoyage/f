theme:
  - light
  - dark
accent:
  - blue
  - teal
  - green
  - yellow
  - orange
  - orange-ubuntu
  - red
  - pink
  - purple
  - slate
density:
  - comfortable
  - cozy
  - compact
window:
  - active
  - inactive
animation:
  - fluid
  - reduced
palette:
  white: oklch(100% 0.00 90.00)
  black: oklch(0% 0.00 0.00)
  gray:
    # 50: oklch(99.5% 0 0)
    # 100: oklch(98.5% 0 0)
    # 150: oklch(97% 0 0)
    # 200: oklch(95% 0 0)
    # 250: oklch(92.5% 0 0)
    # 300: oklch(89% 0 0)
    # 400: oklch(80% 0 0)
    # 500: oklch(68% 0 0)
    # 600: oklch(54% 0 0)
    # 700: oklch(38% 0 0)
    # 800: oklch(22% 0 0)
    # 900: oklch(11% 0 0)
    50: oklch(99.5% 0 0)
    100: oklch(98.5% 0 0)
    150: oklch(97% 0 0)
    200: oklch(95% 0 0)
    250: oklch(92.5% 0 0)
    300: oklch(89% 0 0)
    350: oklch(85% 0 0)
    400: oklch(80% 0 0)
    450: oklch(74% 0 0)
    500: oklch(68% 0 0)
    550: oklch(61% 0 0)
    600: oklch(54% 0 0)
    650: oklch(46% 0 0)
    700: oklch(38% 0 0)
    750: oklch(30% 0 0)
    800: oklch(22% 0 0)
    850: oklch(16% 0 0)
    900: oklch(11% 0 0)
  accent:
    blue: oklch(61.4% 0.164 255)
    teal: oklch(60.3% 0.098 213)
    green: oklch(59.4% 0.139 147)
    yellow: oklch(67.4% 0.142 76)
    orange: oklch(65.4% 0.196 42)
    red: oklch(60.3% 0.217 22)
    pink: oklch(65.1% 0.158 352)
    purple: oklch(52.5% 0.175 317)
    slate: oklch(60.1% 0.037 247)
  focus: color-mix(in oklab, palette.accent 50%, transparent)
color:
  surface:
    dark: palette.gray.900
  on-surface:
    dark: palette.gray.100
  sidebar:
    dark: palette.gray.700
  user:
    dark: palette.gray.800
  field:
    dark: palette.gray.750
  scrollbar-thumb:
    dark: palette.gray.600
typeface:
  # sans: Noto Sans, sans-serif
  sans: Ubuntu Sans, sans-serif
  serif: EB Garamond, serif
  mono: Fira Code, monospace
app:
  app: flex h-100dvh font-sans bg-surface text-on-surface text-lg
sidebar:
  sidebar: w-xs h-full bg-sidebar
nav:
  new_thread: px-2
threads:
  thread: flex h-8
  set_thread: flex-1 px-2 text-nowrap text-ellipsis
  delete_thread: px-2
main:
  main: grow-1 flex-col
  # main: grow-1 relative
page:
  # page: flex justify-center py-8 pb-48
  # content: w-prose
  page: flex-1
  # page: overflow-hidden flex-1
  # page: size-full
  # content: overflow-x-hidden
  # content: overflow-x-hidden mb-40
  '& b, strong': font-semibold
  '& i, em, cite, dfn, address': italic
  '& pre, code': font-mono
messages:
  message: w-full py-8 flex justify-center
  message[role=user]: bg-user
  message_content: w-prose
prompt:
  prompt: w-full h-40 flex justify-center bg-field
  # prompt: absolute bottom-0 w-full h-40 flex justify-center bg-field
  field: w-prose
  textarea: py-8
textarea:
  textarea: w-full h-fit rounded-md
  textarea:focus-visble: outline-focus outline-sm offset-2 rounded-md
input:
  input: w-full h-full p-4 rounded-md text-lg
  input:focus-visble: outline-focus outline-sm offset-2 rounded-md
scroll:
  scroll: flex flex-1 relative
  # scroll: flex flex-1 relative overflow-hidden
  content: flex-1 overflow-auto
  vertical_scrollbar: z-100 absolute right-0 top-0 bottom-0
  vertical_track: w-3 h-full opacity-0 transition-opacity duration-0.5s
  vertical_track[show]: opacity-1
  vertical_thumb: w-full bg-scrollbar-thumb
  horizontal_scrollbar: z-100 absolute bottom-0 left-0 right-0
  horizontal_track: h-3 w-full opacity-0 transition-opacity duration-0.5s
  horizontal_track[show]: opacity-1
  horizontal_thumb: h-full bg-scrollbar-thumb
