theme:
  - light
  - dark
accent:
  - blue
  - teal
  - green
  - yellow
  - orange
  - orange-ubuntu
  - red
  - pink
  - purple
  - slate
density:
  - comfortable
  - cozy
  - compact
window:
  - active
  - inactive
animation:
  - fluid
  - reduced # reduced animation

palette:
  gray:
    50: oklch(99.0% 0 0)
    100: oklch(97.7% 0 0)
    200: oklch(92.6% 0 0)
    300: oklch(85.6% 0 0)
    400: oklch(77.1% 0 0)
    500: oklch(67.5% 0 0)
    600: oklch(56.9% 0 0)
    700: oklch(45.3% 0 0)
    800: oklch(33.0% 0 0)
    850: oklch(26.0% 0 0)
    900: oklch(19.8% 0 0)
    950: oklch(13.0% 0 0)

color:
  bg:
    accent:
      blue: oklch(61.4% 0.164 255)
      teal: oklch(60.3% 0.098 213)
      green: oklch(59.4% 0.139 147)
      yellow: oklch(67.4% 0.142 76)
      orange: oklch(65.4% 0.196 42)
      orange-ubuntu: oklch(64.049% 0.19406 37.743)
      red: oklch(60.3% 0.217 22)
      pink: oklch(65.1% 0.158 352)
      purple: oklch(52.5% 0.175 317)
      slate: oklch(60.1% 0.037 247)
    primary: # core canvas
      light: "palette.gray.50"
      dark: "palette.gray.850"
      # dark: "palette.gray.900"
    secondary: # panel
      light: "palette.gray.200"
      dark: "palette.gray.800"
      # dark: "palette.gray.850"
    tertiary: # button on panel
      light: "palette.gray.300"
      dark: "palette.gray.700"
    selection:
      active: color-mix(in oklab, color.bg.accent 30%, transparent)
      inactive: color-mix(in oklab, palette.gray.500 20%, transparent)
    focus: color-mix(in oklab, color.bg.accent 30%, transparent)
    backdrop: color-mix(in oklab, palette.gray.950 30%, transparent)
    scrollbar: color-mix(in oklab, color.fg.primary 50%, transparent)
    tooltip: palette.gray.900
    commands:
      light: color-mix(in oklab, palette.gray.200 30%, color.bg.primary)
      dark: color-mix(in oklab, palette.gray.950 30%, color.bg.primary)
    hover: color-mix(in oklab, color.bg.tertiary 50%, transparent)
    click: color.bg.tertiary

  fg:
    primary:
      light: palette.gray.800
      dark: white
    secondary:
      light: palette.gray.800
      dark: white
    tertiary:
      light: palette.gray.800
      dark: white
    placeholder:
      light: palette.gray.500
      dark: palette.gray.500
    tooltip: white

spacing:
  0.5: 0.125rem
  1: 0.25rem
  1.5: 0.375rem
  2: 0.5rem
  2.5: 0.625rem
  3: 0.75rem
  3.5: 0.875rem
  4: 1rem
  5: 1.25rem
  6: 1.5rem
  7: 1.75rem
  8: 2rem
  9: 2.25rem
  10: 2.5rem
  11: 2.75rem
  12: 3rem
  14: 3.5rem
  16: 4rem
  20: 5rem
  24: 6rem
  28: 7rem
  32: 8rem
  36: 9rem
  40: 10rem
  44: 11rem
  48: 12rem
  52: 13rem
  56: 14rem
  60: 15rem
  64: 16rem
  72: 18rem
  80: 20rem
  96: 24rem

max-width:
  none: none
  xs: 20rem # Narrow UI cards
  sm: 24rem # Sidebars / Dialogs
  md: 28rem # Small article columns
  lg: 32rem # Standard content blocks
  xl: 36rem # Medium readability blocks
  2xl: 42rem # Standard grid containers
  3xl: 48rem # Content layouts
  4xl: 56rem # Content layouts
  5xl: 64rem # Wide sections
  6xl: 72rem # Wide sections
  7xl: 80rem # Maximum default page width (1280px)
  prose: 65ch
  full: 100%
  min: min-content
  max: max-content
  fit: fit-content
  screen-sm: 640px
  screen-md: 768px
  screen-lg: 1024px
  screen-xl: 1280px
  screen-2xl: 1536px

# breakpoint:
#   sm: 640px
#   md: 768px
#   lg: 1024px
#   xl: 1280px
#   2xl: 1536px

typeface:
  sans: "Roboto, Adwaita Sans, Ubuntu Sans, Noto Sans, sans-serif"
  serif: "EB Garamond, Noto Serif, serif"
  monospace: "Fira Code, Adwaita Mono, Ubuntu Mono, monospace"

text:
  xs: 0.75rem/1rem
  sm: 0.875rem/1.25rem
  base: 1rem/1.5rem
  lg: 1.125rem/1.75rem
  xl: 1.25rem/1.75rem
  2xl: 1.5rem/2rem
  3xl: 1.875rem/2.25rem
  4xl: 2.25rem/2.5rem
  5xl: 3rem/1
  6xl: 3.75rem/1
  7xl: 4.5rem/1
  8xl: 6rem/1
  9xl: 8rem/1

icon:
  xs: 0.75rem
  sm: 0.875rem
  base: 1rem
  lg: 1.125rem
  xl: 1.25rem
  2xl: 1.5rem
  3xl: 1.875rem
  4xl: 2.25rem
  5xl: 3rem
  6xl: 3.75rem
  7xl: 4.5rem
  8xl: 6rem
  9xl: 8rem

font:
  heading: bold text.lg typeface.sans
  text: text.base typeface.sans
  code: text.sm typeface.monospace

radius:
  none: 0px
  xs: 2px
  sm: 2px
  base: 4px
  md: 6px
  lg: 8px
  xl: 12px
  2xl: 16px
  3xl: 24px
  4xl: 32px
  full: 9999px

  # xs: "4px"
  # sm: "8px"
  # md: "12px"
  # lg: "16px"
  # xl: "24px"
  # 2xl: "32px"

border:
  0: 0px
  1: 1px
  2: 2px
  # 3: 3px
  4: 4px
  8: 8px

hierarchy:
  backdrop-hidden: -200
  backdrop: 200
  sidebar: 400
  dialog: 600 # preferences, keyboard shortcuts, about
  popup: 800 # select dropdown
  commands: 850 # command palette
  toast: 900
  tooltip: 1000
  graph:
    grid: -200
    range: 200
    line: 400
    axis: 500
    point: 600
    label: 1000

transition:
  backdrop:
    fluid: 0.3s ease
    reduced: 0s ease
  scrollbar:
    fluid: 0.15s ease
    reduced: 0s ease

page:
  whitespace:
    comfortable: spacing.2
    cozy: spacing.1
    compact: spacing.1
  whitespace-sm:
    comfortable: spacing.1
    cozy: spacing.1
    compact: spacing.1
titlebar:
  height:
    comfortable: spacing.12
    cozy: spacing.10
    compact: spacing.8
sidebar:
  width:
    comfortable: spacing.72
    cozy: spacing.64
    compact: spacing.60
field:
  outline:
    width: border.2
    width-lg: border.4
