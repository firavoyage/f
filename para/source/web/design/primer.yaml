theme:
  - light
  - dark
palette:
color:
  accent: oklch(55% 0.15 146.26)
  primary:
    dark: black
  on-primary:
    dark: white
  secondary:
    dark: oklch(27% 0.02 251.92)
  hover:
    dark: oklch(29% 0.02 260.62)
  focus:
    dark: oklch(57% 0.20 259.67)
typeface:
  sans: Noto Sans, sans-serif
  serif: EB Garamond, serif
  # sans: Ubuntu Sans, sans-serif
  # serif: EB Garamond, serif
app:
  app: h-100dvh
page:
  page: flex justify-center
  content: w-xl
  # content: w-80ch
search:
  search: fixed top-0 w-full flex justify-center items-center font-sans
  input: p-1
  content: w-xl max-h-20rem overflow-hidden bg-primary rounded-md
  results: px-2
  result: w-full px-2 py-0.5 rounded-md
  result[focus]: bg-hover
input:
  input: w-full p-1 rounded-md
  'input:focus-visble': outline-focus outline-sm offset-2 rounded-md
scroll:
  scroll: flex flex-1 relative overflow-hidden
  content: flex-1 overflow-auto
  vertical_scrollbar: absolute right-0 top-0 bottom-0
  vertical_track: w-2 h-full opacity-0 transition-opacity duration-0.3s
  vertical_track[show]: opacity-1
  vertical_thumb: w-full bg-on-primary
  horizontal_scrollbar: absolute bottom-0 left-0 right-0
  horizontal_track: h-2 w-full opacity-0 transition-opacity duration-0.3s
  horizontal_track[show]: opacity-1
  horizontal_thumb: h-full bg-on-primary
