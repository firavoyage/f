theme:
  - light
  - dark
palette:
color:
  accent: oklch(55% 0.15 146.26)
  primary:
    dark: black
  on-primary:
    dark: white
  secondary:
    dark: oklch(27% 0.02 251.92)
  hover:
    dark: oklch(29% 0.02 260.62)
typeface:
  sans: Noto Sans, sans-serif
  serif: EB Garamond, serif
  # sans: Ubuntu Sans, sans-serif
  # serif: EB Garamond, serif
app:
  app: h-100dvh
page:
  page: flex justify-center
  content: w-xl
  # content: w-80ch
search:
  search: fixed top-0 w-100% flex justify-center items-center font-sans
  content: w-xl max-h-20rem overflow-y-auto bg-primary
  result: w-100%
  result[focus]: bg-hover
input:
  input: w-100%
