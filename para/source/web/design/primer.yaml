theme:
  - light
  - dark
palette:
color:
  accent: oklch(55% 0.15 146.26)
  surface:
    dark: black
  on-surface:
    dark: white
  dropdown:
    dark: oklch(10% 0.02 248.35)
  button:
    dark: oklch(27% 0.02 251.92)
  border:
    dark: oklch(38% 0.02 254.74)
  hover:
    dark: oklch(21% 0.01 258.37)
  select:
    dark: oklch(29% 0.02 260.62)
  focus:
    dark: oklch(57% 0.20 259.67)
typeface:
  sans: Noto Sans, sans-serif
  serif: EB Garamond, serif
  # sans: Ubuntu Sans, sans-serif
  # serif: EB Garamond, serif
app:
  app: h-100dvh font-sans
page:
  page: flex justify-center
  content: w-xl
  # content: w-80ch
search:
  search: fixed top-0 w-full flex justify-center items-center
  content: w-xl max-h-20rem overflow-hidden bg-dropdown rounded-md
  query: p-2
  results: px-2
  result: w-full px-2 py-0.5 rounded-md
  'result:hover': bg-hover
  result[focus]: bg-select
toc:
  toc: fixed right-4 top-10 bottom-10 w-xs
  h2: ml-2
  h3: ml-4
  h4: ml-6
  h5: ml-8
  h6: ml-10
input:
  input: w-full px-2 py-1 rounded-md
  'input:focus-visble': outline-focus outline-sm offset-2 rounded-md
scroll:
  scroll: flex flex-1 relative overflow-hidden
  content: flex-1 overflow-auto
  vertical_scrollbar: absolute right-0 top-0 bottom-0
  vertical_track: w-3 h-full opacity-0 transition-opacity duration-0.5s
  vertical_track[show]: opacity-1
  vertical_thumb: w-full bg-border
  horizontal_scrollbar: absolute bottom-0 left-0 right-0
  horizontal_track: h-3 w-full opacity-0 transition-opacity duration-0.5s
  horizontal_track[show]: opacity-1
  horizontal_thumb: h-full bg-border
