[project]
name = "cp"
version = "0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 2

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["F"]
# select = ["E", "F", "I", "UP", "B"]
ignore = ["F401"] # unused import

[tool.ruff.lint.isort]
combine-as-imports = true
